<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Tti Labs screen edition</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B1D38">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0B1D38; cursor: none;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  /* the 1080×1920 design, scaled to whatever the screen reports */
  #stage { position: absolute; left: 50%; top: 50%; width: 1080px; height: 1920px; margin: -960px 0 0 -540px;
    overflow: hidden; background: #0B1D38; }
  .slide, .wrap, .par, .bg, .fg, #chrome, .dim { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  .wrap { overflow: hidden; }
  .bg, .fg, #chrome { display: block; }
  .dim { background: #0B1D38; opacity: 0; }
  /* every move is transform or opacity only: composited, smooth on an old WebView */
  .wrap, .par, .bg, .fg, .dim { -webkit-backface-visibility: hidden; backface-visibility: hidden; will-change: transform, opacity; }
  #chrome { z-index: 100; }
</style>
<script>
// ?list=name plays playlists/name.js (default: main). A new edition is a new playlist file, never a new player.
var LIST = (location.search.match(/list=([\w-]+)/) || [0, "main"])[1];
document.write('<script src="playlists/' + LIST + '.js"><\/script>');
</script>
</head><body>
<div id="stage"><img id="chrome" alt=""></div>
<script>
// Plain ES5 for Android 7's WebView (Chromium 51+). Only the slide on screen and the next one are in memory.
// PLAYLIST = { hold: ms, chrome: "path or empty", slides: [{ bg: "path", fg: "path (optional)", t: "wipe|fade", hold: ms (optional) }] }
window.onerror = function () { setTimeout(function () { location.reload(); }, 5000); };   // any script error: start over
(function () {
  var stage = document.getElementById("stage"), chrome = document.getElementById("chrome");
  var speed = +(location.search.match(/speed=([\d.]+)/) || [0, 1])[1];
  var EASE = "cubic-bezier(.76,0,.24,1)", OUT = "cubic-bezier(.16,1,.3,1)";
  var list = PLAYLIST.slides, i = -1, cur = null, next = null;
  if (PLAYLIST.chrome) chrome.src = PLAYLIST.chrome; else chrome.style.display = "none";

  function fit() {
    var s = Math.min(window.innerWidth / 1080, window.innerHeight / 1920);
    stage.style.webkitTransform = stage.style.transform = "scale(" + s + ")";
  }
  window.addEventListener("resize", fit); fit();

  function css(el, tr, op, dur, ease, delay) {
    var t = dur ? "transform " + dur + "ms " + ease + " " + (delay || 0) + "ms, opacity " + dur + "ms " + ease + " " + (delay || 0) + "ms" : "none";
    el.style.webkitTransition = el.style.transition = t;
    if (tr != null) el.style.webkitTransform = el.style.transform = tr;
    if (op != null) el.style.opacity = op;
  }
  function img(src, cls) { var m = new Image(); m.className = cls; m.src = src; m.alt = ""; return m; }

  function build(n) {                                   // one slide: wrap (the mask) > par (parallax) > bg (slow push); fg on top
    var d = list[n], el = document.createElement("div");
    el.className = "slide";
    el.innerHTML = '<div class="wrap"><div class="par"></div><div class="dim"></div></div>';
    el.wrap = el.firstChild; el.par = el.wrap.firstChild; el.dim = el.wrap.lastChild;
    el.bg = img(d.bg, "bg"); el.par.appendChild(el.bg);
    if (d.fg) { el.fg = img(d.fg, "fg"); el.appendChild(el.fg); }
    el.t = d.t || "fade"; el.hold = d.hold || PLAYLIST.hold;
    return el;
  }
  function ready(el, cb) {                              // wait until every layer is decoded, so a move never starts on a blank
    var ms = el.fg ? [el.bg, el.fg] : [el.bg], left = ms.length, done = function () { if (--left === 0) cb(); };
    ms.forEach(function (m) {
      if (m.complete && m.naturalWidth) done(); else { m.onload = done; m.onerror = done; }
    });
  }
  function prepare() { next = build((i + 1) % list.length); }

  function show() {
    i = (i + 1) % list.length;
    var inc = next, out = cur, T = 1400 / speed, HOLD = inc.hold / speed; next = null;
    // start states, no transition
    if (inc.t === "wipe") { css(inc.wrap, "translate3d(0,100%,0)", 1); css(inc.par, "translate3d(0,-70%,0)"); }
    else { css(inc.wrap, "translate3d(0,0,0)", 0); css(inc.par, "translate3d(0,0,0) scale(1.08)"); }
    css(inc.bg, "scale(1)");
    if (inc.fg) css(inc.fg, "translate3d(0,70px,0)", 0);
    stage.insertBefore(inc, chrome);
    inc.offsetWidth;                                    // commit the start state before the move
    if (inc.t === "wipe") { css(inc.wrap, "translate3d(0,0,0)", null, T, EASE); css(inc.par, "translate3d(0,0,0)", null, T, EASE); }
    else { css(inc.wrap, null, 1, T, EASE); css(inc.par, "translate3d(0,0,0) scale(1)", null, T * 1.4, OUT); }
    css(inc.bg, "scale(" + (inc.fg ? 1.06 : 1.03) + ")", null, HOLD + T, "linear");   // the slow push while it holds
    if (inc.fg) css(inc.fg, "translate3d(0,0,0)", 1, 1000 / speed, OUT, T * .55);      // the words settle after the picture
    if (out) {
      if (out.fg) css(out.fg, "translate3d(0,-50px,0)", 0, 500 / speed, "cubic-bezier(.5,0,.75,0)");
      if (inc.t === "wipe") { css(out.wrap, "translate3d(0,-22%,0)", null, T, EASE); css(out.dim, null, .7, T, EASE); }
      setTimeout(function () { stage.removeChild(out); }, T * 1.5);
    }
    cur = inc;
    setTimeout(prepare, T * 1.6);                       // load the next slide once this move is over
    setTimeout(function wait() { if (next) ready(next, show); else setTimeout(wait, 200); }, HOLD);
  }

  // keep the screen awake: Wake Lock where the browser has it (Chrome 84+), else a tiny muted looping video
  // (inline, so it works offline); the Android app also does this itself
  var KEEP = "data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAANybW9vdgAAAGxtdmhkAAAAAAAAAAAAAAAAAAAD6AAAD6AAAQAAAQAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAgAAAp10cmFrAAAAXHRraGQAAAADAAAAAAAAAAAAAAABAAAAAAAAD6AAAAAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAABAAAAAABAAAAAQAAAAAAAkZWR0cwAAABxlbHN0AAAAAAAAAAEAAA+gAAAAAAABAAAAAAIVbWRpYQAAACBtZGhkAAAAAAAAAAAAAAAAAAAoAAAAoABVxAAAAAAALWhkbHIAAAAAAAAAAHZpZGUAAAAAAAAAAAAAAABWaWRlb0hhbmRsZXIAAAABwG1pbmYAAAAUdm1oZAAAAAEAAAAAAAAAAAAAACRkaW5mAAAAHGRyZWYAAAAAAAAAAQAAAAx1cmwgAAAAAQAAAYBzdGJsAAAAuHN0c2QAAAAAAAAAAQAAAKhhdmMxAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAAAABAAEABIAAAASAAAAAAAAAABFExhdmM2My4xLjEwMCBsaWJ4MjY0AAAAAAAAAAAAAAAAGP//AAAALmF2Y0MBQsAK/+EAFmdCwArZHsBEAAADAAQAAAMAKDxImSABAAVoy4PLIAAAABBwYXNwAAAAAQAAAAEAAAAUYnRydAAAAAAAAAZyAAAAAAAAABhzdHRzAAAAAAAAAAEAAAAUAAAIAAAAABRzdHNzAAAAAAAAAAEAAAABAAAAHHN0c2MAAAAAAAAAAQAAAAEAAAAUAAAAAQAAAGRzdHN6AAAAAAAAAAAAAAAUAAACjAAAAAoAAAAKAAAACQAAAAkAAAAJAAAACQAAAAkAAAAJAAAACQAAAAkAAAAJAAAACQAAAAkAAAAJAAAACQAAAAkAAAAJAAAACQAAAAkAAAAUc3RjbwAAAAAAAAABAAADogAAAGF1ZHRhAAAAWW1ldGEAAAAAAAAAIWhkbHIAAAAAAAAAAG1kaXJhcHBsAAAAAAAAAAAAAAAALGlsc3QAAAAkqXRvbwAAABxkYXRhAAAAAQAAAABMYXZmNjMuMS4xMDAAAAAIZnJlZQAAA0FtZGF0AAACcAYF//9s3EXpvebZSLeWLNgg2SPu73gyNjQgLSBjb3JlIDE2NSByMzIyMyAwNDgwY2IwIC0gSC4yNjQvTVBFRy00IEFWQyBjb2RlYyAtIENvcHlsZWZ0IDIwMDMtMjAyNSAtIGh0dHA6Ly93d3cudmlkZW9sYW4ub3JnL3gyNjQuaHRtbCAtIG9wdGlvbnM6IGNhYmFjPTAgcmVmPTMgZGVibG9jaz0xOjA6MCBhbmFseXNlPTB4MToweDExMSBtZT1oZXggc3VibWU9NyBwc3k9MSBwc3lfcmQ9MS4wMDowLjAwIG1peGVkX3JlZj0xIG1lX3JhbmdlPTE2IGNocm9tYV9tZT0xIHRyZWxsaXM9MSA4eDhkY3Q9MCBjcW09MCBkZWFkem9uZT0yMSwxMSBmYXN0X3Bza2lwPTEgY2hyb21hX3FwX29mZnNldD0tMiB0aHJlYWRzPTEgbG9va2FoZWFkX3RocmVhZHM9MSBzbGljZWRfdGhyZWFkcz0wIG5yPTAgZGVjaW1hdGU9MSBpbnRlcmxhY2VkPTAgYmx1cmF5X2NvbXBhdD0wIGNvbnN0cmFpbmVkX2ludHJhPTAgYmZyYW1lcz0wIHdlaWdodHA9MCBrZXlpbnQ9MjUwIGtleWludF9taW49NSBzY2VuZWN1dD00MCBpbnRyYV9yZWZyZXNoPTAgcmNfbG9va2FoZWFkPTQwIHJjPWNyZiBtYnRyZWU9MSBjcmY9MjMuMCBxY29tcD0wLjYwIHFwbWluPTAgcXBtYXg9NjkgcXBzdGVwPTQgaXBfcmF0aW89MS40MCBhcT0xOjEuMDAAgAAAABRliIQEfEYoAAxixwABDGjgACDzgAAAAAZBmjgI+oAAAAAGQZpUAj6gAAAABUGaYBH1AAAABUGagBH1AAAABUGaoBH1AAAABUGawBH1AAAABUGa4BH1AAAABUGbABH1AAAABUGbIBH1AAAABUGbQBH1AAAABUGbYBH1AAAABUGbgBH1AAAABUGboBH1AAAABUGbwBH1AAAABUGb4BH1AAAABUGaABH1AAAABUGaIBH1AAAABUGaQBD1AAAABUGaYD/U";
  function videoAwake() {
    if (videoAwake.v) return;
    var v = videoAwake.v = document.createElement("video");
    v.muted = true; v.loop = true; v.setAttribute("muted", ""); v.setAttribute("playsinline", ""); v.src = KEEP;
    v.style.cssText = "position:absolute;left:0;top:0;width:2px;height:2px;opacity:.01;z-index:101";
    document.body.appendChild(v);
    var p = v.play(); if (p && p.catch) p.catch(function () {});
  }
  function lock() { if (navigator.wakeLock) navigator.wakeLock.request("screen").catch(videoAwake); else videoAwake(); }
  lock(); document.addEventListener("visibilitychange", function () { if (!document.hidden) lock(); });
  setTimeout(function () { location.reload(); }, 6 * 3600 * 1000);   // pick up new slides every 6 h

  // the Chrome fallback: work offline once loaded over http(s); a tap goes full screen in a plain browser tab
  if (navigator.serviceWorker && /^http/.test(location.protocol)) navigator.serviceWorker.register("sw.js");
  document.addEventListener("click", function () {
    var d = document.documentElement, f = d.requestFullscreen || d.webkitRequestFullscreen; if (f) f.call(d);
    if (videoAwake.v) videoAwake.v.play();             // in case autoplay was held back until a tap
  });

  prepare(); ready(next, show);
})();
</script>
</body></html>
